<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareSync — Alexa+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&family=Outfit:wght@380;500;640&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="room">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Alexa+ simulator</p>
          <h1>CareSync</h1>
        </div>
      </div>
      <p class="who">Maya Reyes, asking about her mom</p>
      <p class="proto" id="proto">MCP · Streamable HTTP</p>
    </header>

    <main class="stage">
      <section class="device" aria-label="Kitchen Echo Show">
        <div class="bezel">
          <div class="screen">
            <div class="screen-bar">
              <span id="clock">–</span>
              <span class="room-name">Kitchen</span>
              <span class="cam" aria-hidden="true"></span>
            </div>
            <div class="orb-wrap" aria-hidden="true">
              <div class="orb" id="orb"></div>
            </div>
            <p class="speech" id="speech">Ask what’s going on with Mom today. I’ll check the dispenser, the visit, and what we already wrote down.</p>
            <div class="cards" id="cards"></div>
          </div>
          <div class="chin" aria-hidden="true"><span></span></div>
        </div>
      </section>

      <aside class="board" id="board" aria-live="polite" aria-label="Elena’s care board"></aside>
    </main>

    <form class="composer" id="composer">
      <button type="button" class="mic" id="mic" aria-label="Hold a voice question">
        <span class="mic-dot" aria-hidden="true"></span>
        Talk
      </button>
      <label class="field">
        <span class="sr">Ask CareSync</span>
        <input id="utterance" name="utterance" autocomplete="off" placeholder="What’s going on with Mom today?" />
      </label>
      <button type="submit" class="send">Ask</button>
    </form>
    <div class="chips" id="chips"></div>

    <footer class="foot">
      <div class="foot-actions">
        <button type="button" id="voice">Voice on</button>
        <button type="button" id="reset">Reset household</button>
      </div>
      <p class="fine">Simulated household. Not a medical device. A yes on an order does not charge a wallet.</p>
      <p class="trace" id="trace"></p>
    </footer>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
